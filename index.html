<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFootball Shop</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }

        /* ส่วนหัว: โปรไฟล์และแบนเนอร์ */
        .header-container {
            display: flex;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto 10px auto;
        }

        .profile-box {
            display: flex;
            flex: 1.2;
        }

        .fb-card {
            background: #1e1e1e; /* เปลี่ยนเป็นสีดำ */
            border: 1px solid #ffd700; /* เพิ่มขอบสีทอง */
            border-radius: 12px;
            padding: 6px 2px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .fb-icon {
            font-size: 10px;
            font-weight: bold;
            background: #ffd700; /* ป้ายคำว่าหลักเปลี่ยนเป็นสีทอง */
            color: #000;
            border-radius: 20px;
            padding: 1px 5px;
            display: inline-block;
            margin-bottom: 3px;
        }

        .fb-card img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffd700;
            display: block;
            margin: 0 auto;
        }

        .fb-name {
            font-size: 10px;
            font-weight: bold;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .banner-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .banner-item img {
            width: 100%;
            height: 38px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ffd700;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: block;
        }

        .notice-bar {
            background: #1e1e1e; /* แถบแจ้งเตือนเป็นสีดำ */
            color: #ffd700; /* ตัวหนังสือสีทอง */
            border: 1px solid #ffd700; /* ขอบสีทอง */
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            padding: 8px;
            border-radius: 12px;
            max-width: 484px;
            margin: 0 auto 15px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* ตารางสินค้า */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            text-decoration: none;
            color: white;
            display: block;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
        }

        .price {
            color: #ffd700;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 0 2px 0;
        }

        .name {
            color: #cccccc;
            font-size: 11px;
            padding-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 4px;
            padding-right: 4px;
        }
    </style>
</head>
<body>

    <!-- ส่วนหัว: โปรไฟล์และแบนเนอร์ -->
    <div class="header-container">
        <!-- เฟซหลัก -->
        <div class="profile-box">
            <a href="https://www.facebook.com/share/1BnjZ4bRmH/" target="_blank" class="fb-card">
                <div class="fb-icon">หลัก</div>
                <img src="https://i.ibb.co/RTtx4yh0/1785019351874.png" alt="Profile">
                <div class="fb-name">ตา คนเก่า</div>
            </a>
        </div>

        <!-- แบนเนอร์ขวา -->
        <div class="banner-box">
            <a href="https://www.facebook.com/share/1BnjZ4bRmH/" target="_blank" class="banner-item">
                <img src="https://i.ibb.co/RTtx4yh0/1785019351874.png" alt="ไก่เดี่ยว">
            </a>
            <a href="https://www.facebook.com/share/1BnjZ4bRmH/" target="_blank" class="banner-item">
                <img src="https://i.ibb.co/RTtx4yh0/1785019351874.png" alt="ไก่คู่">
            </a>
        </div>
    </div>

    <!-- ข้อความแจ้งเตือน -->
    <div class="notice-bar">ติดต่อสอบถามกดที่รูปได้เลย!</div>

    <!-- รายการสินค้า -->
    <div class="product-grid">

        <!-- สินค้าชิ้นที่ 1 -->
        <a href="https://www.facebook.com/share/1BnjZ4bRmH/" target="_blank" class="card">
            <img src="https://i.ibb.co/RTtx4yh0/1785019351874.png" alt="Messi">
            <div class="price">200 บาท</div>
            <div class="name">Messi</div>
        </a>

        <!-- สินค้าชิ้นที่ 2 -->
        <a href="https://www.facebook.com/share/1BnjZ4bRmH/" target="_blank" class="card">
            <img src="https://i.ibb.co/RTtx4yh0/1785019351874.png" alt="Hazard">
            <div class="price">150 บาท</div>
            <div class="name">Hazard</div>
        </a>

        <!-- สินค้าชิ้นที่ 3 -->
        <a href="https://www.facebook.com/share/1BnjZ4bRmH/" target="_blank" class="card">
            <img src="https://i.ibb.co/RTtx4yh0/1785019351874.png" alt="Vieira">
            <div class="price">150 บาท</div>
            <div class="name">Vieira</div>
        </a>

    </div>

</body>
</html>
