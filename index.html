
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายไอดี eFootball</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        h2 {
            color: #2dd4bf;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            color: #facc15;
            font-size: 16px;
            font-weight: bold;
            margin: 8px 0 2px 0;
        }

        .name {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #f43f5e;
            color: white;
            text-decoration: none;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>รายการไอดี eFootball พร้อมส่ง</h2>

    <div class="grid-container">

        <!-- สินค้าที่ 1: Ferran Torres -->
        <div class="card">
            <img src="https://i.ibb.co/m5tLJGMV/Ferran-Torres-efhub.png" alt="Ferran Torres">
            <div class="price">20 บาท</div>
            <div class="name">Ferran Torres</div>
            <a href="https://www.facebook.com/share/1ELPiB4Ek6/" target="_blank" class="btn">ทักซื้อ</a>
        </div>

        <!-- สินค้าที่ 2: Rodri -->
        <div class="card">
            <img src="https://i.ibb.co/sdpdzDBR/Rodri-efhub.png" alt="Rodri">
            <div class="price">50 บาท</div>
            <div class="name">Rodri</div>
            <a href="https://www.facebook.com/share/1ELPiB4Ek6/" target="_blank" class="btn">ทักซื้อ</a>
        </div>

        <!-- สินค้าที่ 3: Marc Cucurella -->
        <div class="card">
            <img src="https://i.ibb.co/1tp0QMyz/Marc-Cucurella-efhub.png" alt="Marc Cucurella">
            <div class="price">40 บาท</div>
            <div class="name">Marc Cucurella</div>
            <a href="https://www.facebook.com/share/1ELPiB4Ek6/" target="_blank" class="btn">ทักซื้อ</a>
        </div>

        <!-- สินค้าที่ 4: Erling Haaland -->
        <div class="card">
            <img src="https://i.ibb.co/bgWNfN6W/Erling-Haaland-efhub.png" alt="Erling Haaland">
            <div class="price">50 บาท</div>
            <div class="name">Erling Haaland</div>
            <a href="https://www.facebook.com/share/1ELPiB4Ek6/" target="_blank" class="btn">ทักซื้อ</a>
        </div>

    </div>

</body>
</html>
