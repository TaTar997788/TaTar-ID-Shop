<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สุ่มไอดี eFootball</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; border: 1px solid #333; }
        .credit { background: #2a2a2a; padding: 10px; border-radius: 5px; font-weight: bold; color: #4CAF50; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-gacha { background: #2196F3; color: #fff; font-size: 16px; }
        .btn-gacha:hover { background: #0b7dda; }
        .btn-back { background: #555; color: #fff; }
        .btn-back:hover { background: #444; }
        #result { margin-top: 15px; font-weight: bold; color: #ff9800; }
    </style>
</head>
<body>

    <div class="box">
        <h2>⚽ สุ่มไอดี eFootball</h2>
        
        <!-- แสดงเครดิตคงเหลือ -->
        <div class="credit">เครดิตคงเหลือ: <span id="creditDisplay">100</span> บาท</div>
        
        <p>ค่าสุ่มครั้งละ 50 บาท</p>
        
        <button class="btn-gacha" onclick="playGacha()">สุ่มไอดีเลย!</button>
        <button class="btn-back" onclick="location.href='index.html'">กลับหน้าหลัก</button>
        
        <div id="result"></div>
    </div>

    <script>
        // กำหนดเครดิตเริ่มต้น 100 บาท (บันทึกไว้ในเครื่อง)
        if (localStorage.getItem('myCredit') === null) {
            localStorage.setItem('myCredit', '100');
        }

        // แสดงผลเครดิตปัจจุบัน
        function updateCreditDisplay() {
            let currentCredit = localStorage.getItem('myCredit');
            document.getElementById('creditDisplay').innerText = currentCredit;
        }
        updateCreditDisplay();

        // ฟังก์ชันสุ่มไอดี
        function playGacha() {
            let currentCredit = parseInt(localStorage.getItem('myCredit'));
            let cost = 50; // ค่าสุ่มครั้งละ 50 บาท

            if (currentCredit < cost) {
                document.getElementById('result').style.color = "red";
                document.getElementById('result').innerText = "❌ เครดิตไม่พอ กรุณาเติมเงินก่อน!";
                return;
            }

            // หักเงิน
            currentCredit -= cost;
            localStorage.setItem('myCredit', currentCredit);
            updateCreditDisplay();

            // รายชื่อไอดีจำลองที่จะสุ่มได้
            let items = [
                "🎉 ยินดีด้วย! คุณได้ไอดี: Messi 105 (Epic)",
                "🎉 ยินดีด้วย! คุณได้ไอดี: Neymar 104 (Show Time)",
                "🎉 ยินดีด้วย! คุณได้ไอดี: Maradona 103 (Legend)",
                "😢 เสียใจด้วย ได้เกลือ (ลองใหม่อีกครั้ง!)",
                "😢 เสียใจด้วย ได้ตัวธรรมดา"
            ];

            let randomItem = items[Math.floor(Math.random() * items.length)];
            
            document.getElementById('result').style.color = "#ff9800";
            document.getElementById('result').innerText = randomItem;
        }
    </script>

</body>
</html>
