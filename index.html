<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขายไอดี eFootball</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 15px;
            text-align: center;
        }

        h2 {
            color: #2dd4bf;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 6px;
        }

        .price {
            color: #facc15;
            font-size: 16px;
            font-weight: bold;
            margin: 6px 0 2px 0;
        }

        .name {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: #f43f5e;
            color: white;
            text-decoration: none;
            padding: 6px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            box-sizing: border-box;
        }

        @media (max-width: 400px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <h2>รายการไอดี eFootball พร้อมส่ง</h2>

    <div class="grid-container">

        <!-- ไอดีที่ 1 -->
        <div class="card">
            <img src="ใส่_URL_รูปDaniOlmo.jpg" alt="Dani Olmo">
            <div class="price">150 บาท</div>
            <div class="name">Dani Olmo</div>
            <a href="https://m.me/yourfacebook" class="btn">ทักซื้อ</a>
        </div>

        <!-- ไอดีที่ 2 -->
        <div class="card">
            <img src="ใส่_URL_รูปHaaland.jpg" alt="Haaland">
            <div class="price">150 บาท</div>
            <div class="name">Haaland</div>
            <a href="https://m.me/yourfacebook" class="btn">ทักซื้อ</a>
        </div>

        <!-- ไอดีที่ 3 -->
        <div class="card">
            <img src="ใส่_URL_รูปHaaland.jpg" alt="Rodri">
            <div class="price">150 บาท</div>
            <div class="name">Rodri</div>
            <a href="https://m.me/yourfacebook" class="btn">ทักซื้อ</a>
        </div>

        <!-- ไอดีที่ 4 -->

            <img src="ใส่_URL_รูปDaniOlmo.jpg" alt="นักเตะ 4">
            <div class="price">150 บาท</div>
            <div class="name">นักเตะ 4</div>
            <a href="https://m.me/yourfacebook" class="btn">ทักซื้อ</a>
        </div>

        <!-- ไอดีที่ 5 -->

        </div>

        <!-- ไอดีที่ 6 -->

        </div>

    </div>

</body>
</html>
